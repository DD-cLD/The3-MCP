[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gma3-mcp"
version = "0.2.2"
description = "MCP server exposing grandMA3 console/onPC control. Implements MA3_MCP_Server_Spec_v2.1."
readme = "README.md"
authors = [{ name = "Alchemease LLC" }]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=3.3,<4",
    "python-osc>=1.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
gma3-mcp = "gma3_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gma3_mcp"]
